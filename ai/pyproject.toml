[project]
name = "patch-ai"
version = "0.1.0"
description = "P.A.T.C.H. ingestion, retrieval, and generation service"
readme = "docs/README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi[standard]>=0.115",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "langchain>=0.3",
  "langchain-core>=1.6.1",
  "langchain-openai>=0.2",
  "langchain-pinecone>=0.2",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.2",
  "langsmith>=0.2",
  "lxml>=5.3",
  "markdown>=3.7",
  "numpy>=2.1",
  "opentelemetry-api>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "opentelemetry-sdk>=1.30",
  "orjson>=3.10",
  "pillow>=11.0",
  "pydantic-settings>=2.7",
  "pymupdf>=1.25",
  "pypdf>=5.1",
  "pypdfium2>=5.13,<6",
  "pytesseract>=0.3.13",
  "python-docx>=1.1",
  "rank-bm25>=0.2.2",
  "sentry-sdk[fastapi]>=2.20",
  "structlog>=24.4",
  "tenacity>=9.0",
  "tiktoken>=0.8",
  "tzdata>=2026.3",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pyright>=1.1.391",
  "respx>=0.22",
  "ruff>=0.9"
]

[project.scripts]
patch-ai = "patch_ai.main:run"

[tool.hatch.envs.default.scripts]
export-openapi = "python scripts/export_openapi.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patch_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
